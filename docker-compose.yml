services:
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 8084
      DB_URL: jdbc:postgresql://${DB_HOST}/auth_db?sslmode=require
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      WALLET_SERVICE_URL: http://wallet-service:8081
    restart: unless-stopped

  wallet-service:
    build: ./services/wallet-service
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://${DB_HOST}/wallet_db?sslmode=require
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    restart: unless-stopped

  inventory-service:
    build: ./services/inventory-service
    environment:
      PORT: 8083
      DB_URL: jdbc:postgresql://${DB_HOST}/inventory_db?sslmode=require
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    restart: unless-stopped

  shop-service:
    build: ./services/shop-service
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://${DB_HOST}/shop_db?sslmode=require
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      WALLET_SERVICE_URL: http://wallet-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8084
      WALLET_SERVICE_URL: http://wallet-service:8081
      SHOP_SERVICE_URL: http://shop-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    depends_on:
      - auth-service
      - wallet-service
      - inventory-service
      - shop-service
    restart: unless-stopped
