server.port=${PORT:8082}
spring.application.name=shop-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shop_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

services.wallet.url=${WALLET_SERVICE_URL:http://localhost:8081}
services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8083}

spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.walletClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.walletClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.walletClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.walletClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.walletClient.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventoryClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventoryClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventoryClient.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventoryProductClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryProductClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryProductClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventoryProductClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventoryProductClient.register-health-indicator=true
resilience4j.timelimiter.instances.walletClient.timeout-duration=20s
resilience4j.timelimiter.instances.inventoryClient.timeout-duration=20s
resilience4j.timelimiter.instances.inventoryProductClient.timeout-duration=20s

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.health.db.enabled=false
management.health.circuitbreakers.enabled=true
app.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me-not-for-production-000}
app.internal.secret=${INTERNAL_SECRET:dev-internal-key-change-me}
