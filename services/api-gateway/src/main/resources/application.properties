server.port=${PORT:8080}
spring.application.name=api-gateway
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=wallet-service
spring.cloud.gateway.server.webflux.routes[1].uri=${WALLET_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/wallet/**

spring.cloud.gateway.server.webflux.routes[2].id=shop-service
spring.cloud.gateway.server.webflux.routes[2].uri=${SHOP_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/shop/**

spring.cloud.gateway.server.webflux.routes[3].id=inventory-service
spring.cloud.gateway.server.webflux.routes[3].uri=${INVENTORY_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:20s}
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:20s}

management.endpoints.web.exposure.include=health,info,gateway

app.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me-not-for-production-000}
app.internal.secret=${INTERNAL_SECRET:dev-internal-key-change-me}
